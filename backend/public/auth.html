<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calomatik Pro · Anmeldung</title><link rel="stylesheet" href="/assets/auth.css"></head>
<body><main><p class="brand">Calomatik Pro</p><h1>Deine Küche.<br>Dein Konto.</h1>
<p>Verbinde den Küchenassistenten und deine Rezepte mit deinem Konto.</p>
<p id="provider"></p><button id="login" disabled>Anmelden</button>
<form id="email-form" hidden><label for="email">E-Mail-Adresse</label><input id="email" type="email" required autocomplete="email" maxlength="254"><button type="submit">Anmeldelink senden</button></form>
<p id="status" role="status">Anmeldung wird vorbereitet …</p><a id="return" hidden>Zurück zu Calomatik Pro</a>
<p class="muted">Du kannst die Küche auch lokal ohne Konto verwenden.</p></main><script type="module" src="/assets/auth.js"></script></body></html>
